<button (click)="toggleLogin($event)">{{loggedIn() ? "Logout": "Login"}}</button>
@if(loggedIn()) {
 <app-logged-in></app-logged-in>
}
@else {
<app-logged-out></app-logged-out>
}


@if(forecast() === undefined) {
  No data
 }
 @else if(forecast()!.isLoading()) {
      Loading
   }
@else if (forecast()!.error()) {
    Error {{forecast()!.error()}}
  }
@else {
  @let f = forecast()!;
  {{f.value()!.items[0].id}}
}
