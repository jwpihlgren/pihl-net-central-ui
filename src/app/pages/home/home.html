<button (click)="toggleLogin($event)">{{loggedIn() ? "Logout": "Login"}}</button>
@if(loggedIn()) {
 <app-logged-in></app-logged-in>
}
@else {
<app-logged-out></app-logged-out>
}


@if(forecastResource.status() === "loading") {
      Loading
 }
 @else if(forecastResource.status() === "error") {
    Error {{forecastResource.error()}}
   }
@else if (forecastResource.hasValue() && forecastResource.value === undefined) {
    No forecast
  }
@else {
  <app-pollen-regional-report [forecast]="forecastResource.value()!"></app-pollen-regional-report>
  }
